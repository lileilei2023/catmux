<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#3d7cf5"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26324a"/><stop offset="1" stop-color="#151c2c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".28"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#sh)"/>
  <g clip-path="url(#tile)">
    <circle cx="220" cy="230" r="70" fill="#fff" opacity=".18"/><circle cx="830" cy="300" r="40" fill="#fff" opacity=".16"/>
    <ellipse cx="512" cy="930" rx="420" ry="120" fill="#2b5fd9" opacity=".55"/>
  </g>
  <g stroke="#1d2640" stroke-linecap="round" stroke-linejoin="round">
    <!-- signal waves (remote) -->
    <path d="M430 196 q-34 36 0 72" fill="none" stroke="#fff" stroke-width="16" opacity=".9"/>
    <path d="M594 196 q34 36 0 72" fill="none" stroke="#fff" stroke-width="16" opacity=".9"/>
    <path d="M392 170 q-62 62 0 124" fill="none" stroke="#fff" stroke-width="14" opacity=".55"/>
    <path d="M632 170 q62 62 0 124" fill="none" stroke="#fff" stroke-width="14" opacity=".55"/>
    <!-- antenna -->
    <line x1="512" y1="330" x2="512" y2="262" stroke-width="22"/>
    <circle cx="512" cy="232" r="36" fill="#ffb547" stroke-width="18"/>
    <!-- ears -->
    <rect x="214" y="462" width="62" height="136" rx="30" fill="#ffb547" stroke-width="20"/>
    <rect x="748" y="462" width="62" height="136" rx="30" fill="#ffb547" stroke-width="20"/>
    <!-- body -->
    <rect x="356" y="712" width="312" height="110" rx="52" fill="#ffffff" stroke-width="22"/>
    <circle cx="512" cy="768" r="20" fill="#ff7a59" stroke-width="12"/>
    <!-- head -->
    <rect x="262" y="330" width="500" height="404" rx="130" fill="#ffffff" stroke-width="24"/>
    <rect x="318" y="392" width="388" height="262" rx="78" fill="url(#screen)" stroke-width="14"/>
  </g>
  <!-- face on the screen -->
  <rect x="350" y="414" width="120" height="26" rx="13" fill="#fff" opacity=".14"/>
  <g fill="none" stroke="#6ef2d6" stroke-linecap="round" stroke-width="24">
    <path d="M392 532 q38 -50 76 0"/><path d="M556 532 q38 -50 76 0"/>
    <path d="M478 586 q34 30 68 0" stroke-width="18"/>
  </g>
  <ellipse cx="372" cy="598" rx="30" ry="17" fill="#ff7ea8" opacity=".85"/>
  <ellipse cx="652" cy="598" rx="30" ry="17" fill="#ff7ea8" opacity=".85"/>
</svg>
