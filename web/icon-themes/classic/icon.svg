<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a2d36"/><stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffab6b"/><stop offset="1" stop-color="#f05a32"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f0703a" stop-opacity=".22"/><stop offset="1" stop-color="#f0703a" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <!-- macOS tile: 824px squircle-ish rounded square on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="512" cy="120" rx="460" ry="260" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="3"/>

  <!-- workbench window -->
  <rect x="188" y="232" width="648" height="560" rx="52" fill="#0a0b0e" stroke="#fff" stroke-opacity=".09" stroke-width="4"/>
  <circle cx="236" cy="276" r="11" fill="#f0544c"/><circle cx="272" cy="276" r="11" fill="#e5b449"/><circle cx="308" cy="276" r="11" fill="#3fb37f"/>

  <!-- left: sessions -->
  <rect x="216" y="316" width="118" height="446" rx="24" fill="#1a1d23"/>
  <rect x="236" y="342" width="78" height="44" rx="12" fill="#f0703a" fill-opacity=".22" stroke="#f0703a" stroke-opacity=".55" stroke-width="3"/>
  <rect x="236" y="406" width="78" height="14" rx="7" fill="#3a3f4a"/>
  <rect x="236" y="436" width="56" height="14" rx="7" fill="#3a3f4a"/>
  <rect x="236" y="466" width="70" height="14" rx="7" fill="#3a3f4a"/>

  <!-- right: files / diff -->
  <rect x="690" y="316" width="118" height="446" rx="24" fill="#1a1d23"/>
  <rect x="710" y="344" width="78" height="14" rx="7" fill="#3a3f4a"/>
  <rect x="710" y="374" width="58" height="14" rx="7" fill="#3a3f4a"/>
  <rect x="710" y="420" width="78" height="16" rx="5" fill="#3fb37f" fill-opacity=".85"/>
  <rect x="710" y="446" width="62" height="16" rx="5" fill="#3fb37f" fill-opacity=".85"/>
  <rect x="710" y="472" width="72" height="16" rx="5" fill="#f0544c" fill-opacity=".85"/>
  <rect x="710" y="518" width="50" height="14" rx="7" fill="#3a3f4a"/>

  <!-- center: the remote terminal prompt -->
  <path d="M408 462 L486 524 L408 586" fill="none" stroke="url(#accent)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="512" y="562" width="120" height="38" rx="19" fill="#eceef2"/>
</svg>
