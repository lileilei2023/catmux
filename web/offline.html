<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="4">
  <meta name="theme-color" content="#101114">
  <title>Catmux · 等待本机后端</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#101114;color:#eceef2;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{max-width:460px;padding:24px;text-align:center;line-height:1.9}
    img{width:72px;height:72px;border-radius:16px;margin-bottom:18px}
    h1{font-size:20px;font-weight:600;margin:0 0 8px}
    p{color:#9aa1ad;margin:6px 0}
    code{display:inline-block;margin:10px 0;padding:8px 14px;background:#16181c;border:1px solid #ffffff14;border-radius:8px;font:13px Menlo,monospace;color:#f0703a}
    small{color:#6b7280}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>本机后端未运行</h1>
    <p>在终端里启动它（或双击“应用程序”里的 Catmux）：</p>
    <code>catmux start</code>
    <p><small>启动后这里会自动进入。远端 tmux 里的 agent 不受影响，一直在运行。</small></p>
  </main>
</body>
</html>
